# A sample job for fuel_prices_lakehouse.

resources:
  jobs:
    carburant:
      name: carburant

      trigger:
        # Run this job every day, exactly one day from the last run
        periodic:
          interval: 1
          unit: DAYS

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}

      tasks:
        - task_key: 01_load_bronze
          notebook_task:
            notebook_path: ../fuel_price_etl/notebooks/01_Bronze/01_bronze_fuel_price.ipynb

        - task_key: 02_load_silver
          depends_on:
            - task_key: 01_load_bronze
          notebook_task:
            notebook_path: ../fuel_price_etl/notebooks/02_Silver/02_silver_fuel_price.ipynb
  
        - task_key: agg_prix_moyen_par_departement
          sql_task:
            warehouse_id: b305b486691336df
            query:
              query_id: 87a7d05a-f674-4145-8bea-87e8597eadf1
          depends_on: 
            - task_key: 02_load_silver

        - task_key: agg_evolution_prix
          sql_task:
            warehouse_id: b305b486691336df
            query:
              query_id: e6290aa7-4bfc-4b70-93d1-40602d584df3
          depends_on: 
            - task_key: 02_load_silver

        - task_key: agg_classement_stations
          sql_task:
            warehouse_id: b305b486691336df
            query:
              query_id: d354c83d-7907-4367-bba6-696e8e2e7e2c
          depends_on: 
            - task_key: 02_load_silver
      
        - task_key: agg_taux_rupture_par_region
          sql_task:
            warehouse_id: b305b486691336df
            query:
              query_id: aa9cdd2c-c2dc-4fd4-9984-68892d76c096
          depends_on: 
            - task_key: 02_load_silver

        - task_key: ou_faire_le_plein
          dashboard_task:
            dashboard_id: 01f196e9597718f58ae8a8a2e990d4d4
          depends_on:
            - task_key: agg_prix_moyen_par_departement
            - task_key: agg_evolution_prix
            - task_key: agg_classement_stations
            - task_key: agg_taux_rupture_par_region

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
