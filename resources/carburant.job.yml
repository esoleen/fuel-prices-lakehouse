# A sample job for fuel_prices_lakehouse.

resources:
  jobs:
    carburant:
      name: carburant

      trigger:
        # Run this job every day, exactly one day from the last run; see https://docs.databricks.com/api/workspace/jobs/create#trigger
        periodic:
          interval: 1
          unit: DAYS

      #email_notifications:
      #  on_failure:
      #    - your_email@example.com

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}

      tasks:
        - task_key: 001_load_landing
          notebook_task:
            notebook_path: ../fuel_price_etl/notebooks/01_Landing.ipynb

        - task_key: 002_load_bronze
          depends_on:
            - task_key: 001_load_landing
          notebook_task:
            notebook_path: ../fuel_price_etl/notebooks/02_Bronze.ipynb

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
