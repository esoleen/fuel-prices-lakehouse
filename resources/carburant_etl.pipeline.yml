# The main pipeline for fuel_prices_lakehouse

resources:
  pipelines:
    fuel_prices_lakehouse_etl:
      name: fuel_prices_lakehouse_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/carburants"

      libraries:
        - glob:
            include: ../src/carburants/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
