# This is a Databricks asset bundle definition for fuel_prices_lakehouse.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: fuel_prices_lakehouse
  uuid: 0b6d160d-235c-4578-8de1-d4cc9981030f

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-6b507e8d-b0ee.cloud.databricks.com
    variables:
      catalog: fuel_price_dev
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-6b507e8d-b0ee.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/eble@synchrone.fr to make sure we only have a single copy.
      root_path: /Workspace/Users/eble@synchrone.fr/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: kyc
      schema: prod
    permissions:
      - user_name: eble@synchrone.fr
        level: CAN_MANAGE
